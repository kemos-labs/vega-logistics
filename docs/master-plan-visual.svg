<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="IBM Plex Sans Arabic, 'Noto Naskh Arabic', Cairo, sans-serif">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#faf6ec"/><stop offset="1" stop-color="#f3eddc"/>
    </linearGradient>
  </defs>
  <rect width="1180" height="760" fill="url(#paper)"/>
  <rect x="24" y="24" width="1132" height="712" fill="#fffdf6" stroke="#d8cfb4" stroke-width="2"/>
  <rect x="24" y="24" width="1132" height="86" fill="#1b231e"/>
  <text x="52" y="66" font-size="30" font-weight="800" fill="#f3eddc">VEGA Logistics OS — Release Roadmap</text>
  <text x="52" y="94" font-size="15" fill="#c8bfa4">خريطة الإصدارات · evidence-tracked · docs/MASTER_PLAN.md · 2026-08-23</text>

  <!-- Promise band -->
  <rect x="52" y="128" width="1076" height="54" rx="10" fill="#efe7cf" stroke="#b9ad8a"/>
  <text x="590" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#1b231e">The promise: in under 30 seconds — planned · delivered · failed · cash outstanding · recovery · attention list · next actions</text>
  <text x="590" y="170" text-anchor="middle" font-size="12" fill="#57503c">الوعد: ما خُطِّط، ما سُلِّم، ما فشل، النقدية المعلّقة، ما يحتاج استرداداً، وما يجب أن يحدث اليوم</text>

  <!-- Ladder -->
  <g font-size="13">
    <!-- R0 done -->
    <rect x="52" y="202" width="520" height="64" rx="10" fill="#dfeadb" stroke="#4c7a58" stroke-width="2"/>
    <text x="72" y="228" font-weight="800" fill="#2c4a34">R0 — Foundation: P1 closed (DONE)</text>
    <text x="72" y="248" fill="#3d5a45">parser fixes batch · reminder baseline · governance reset</text>

    <rect x="608" y="202" width="520" height="64" rx="10" fill="#f7f1de" stroke="#a89455" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="628" y="228" font-weight="800" fill="#6d5c22">R1 — Daily Control Tower (NEXT)</text>
    <text x="628" y="248" fill="#71653f">one home view: yesterday · today · cash · exceptions &lt; 30s</text>

    <rect x="52" y="282" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="70" y="308" font-weight="800" fill="#1b231e">R2 — Shipment &amp; stop planning</text>
    <text x="70" y="327" fill="#57503c">StopRecord model · manual + paste/CSV preview</text>
    <text x="70" y="345" fill="#57503c">duplicate detection · confirm-before-mutation</text>

    <rect x="420" y="282" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="438" y="308" font-weight="800" fill="#1b231e">R3 — Morning dispatch &amp; manifest</text>
    <text x="438" y="327" fill="#57503c">assignment board · accessible ordering</text>
    <text x="438" y="345" fill="#57503c">bilingual print manifest («مستند تشغيلي داخلي»)</text>

    <rect x="788" y="282" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="806" y="308" font-weight="800" fill="#1b231e">R4 — Evening close &amp; exception loop</text>
    <text x="806" y="327" fill="#57503c">loaded = delivered + returned + pending</text>
    <text x="806" y="345" fill="#57503c">COD expected/collected/remitted · recovery links</text>

    <rect x="52" y="374" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="70" y="400" font-weight="800" fill="#1b231e">R5 — Compliance-lite readiness</text>
    <text x="70" y="419" fill="#57503c">Short Address format-only · National Address flag</text>
    <text x="70" y="437" fill="#57503c">VAT drafts (15% [REG]) · QR payload · disclaimers</text>

    <rect x="420" y="374" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="438" y="400" font-weight="800" fill="#1b231e">R6 — Operational analytics</text>
    <text x="438" y="419" fill="#57503c">driver/customer scorecards · COD lag · fuel control</text>
    <text x="438" y="437" fill="#57503c">recorded data only · definitions per KPI dictionary</text>

    <rect x="788" y="374" width="340" height="76" rx="10" fill="#fffdf6" stroke="#8b8062" stroke-width="2"/>
    <text x="806" y="400" font-weight="800" fill="#1b231e">R7 — Route-lite (evaluate)</text>
    <text x="806" y="419" fill="#57503c">manual order first · OSRM behind env flag</text>
    <text x="806" y="437" fill="#57503c">CSP origin named · attribution · offline fallback</text>

    <rect x="240" y="466" width="700" height="64" rx="10" fill="#f1eee6" stroke="#8b8062" stroke-width="2"/>
    <text x="258" y="492" font-weight="800" fill="#1b231e">R8 — Optional sync (last): Supabase opt-in · magic link · RLS · KSA region (PDPL gate)</text>
    <text x="258" y="512" fill="#57503c">local-first boot · conflict preview · tombstones · deletion path</text>
  </g>

  <!-- Ground truth strip -->
  <rect x="52" y="552" width="1076" height="120" rx="10" fill="#1b231e"/>
  <text x="72" y="580" font-size="15" font-weight="800" fill="#f3eddc">KSA ground truth locked by sources (docs/RESEARCH_DOSSIER.md)</text>
  <text x="72" y="604" font-size="12.5" fill="#d9d2ba">TGA news 198: National Address required from 2026-01-01, fines 5–50k SAR [PRIMARY] · Short Address AAAA9999 [SPL]</text>
  <text x="72" y="624" font-size="12.5" fill="#d9d2ba">VAT Law Art.2: «بنسبة أساسية قدره (%15)» [PRIMARY] · GASTAT 2024: &gt;180M parcels, 96% on-time [OFFICIAL STATS]</text>
  <text x="72" y="644" font-size="12.5" fill="#d9d2ba">SAMA COD 25% survey share · PDPL: minimization + 72h breach notice [PRIMARY] · Ramadan 26M parcels (+18%) [SPA/TGA]</text>

  <!-- Laws footer -->
  <text x="52" y="700" font-size="12" fill="#71653f">Laws: native Saudi Arabic (Cairo) · no compliance claims without evidence · local-first truth · free-stack only · every release passes full gates before deploy.</text>
  <text x="52" y="720" font-size="12" fill="#71653f">قانون ثابت: عربية سعودية أصيلة · لا ادعاءات نظامية بلا دليل · البيانات محلية أولاً · بوابات الجودة قبل كل نشر.</text>
</svg>
